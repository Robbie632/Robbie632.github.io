<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Portfolio</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div style="height: 20px"></div>
    <div

        id="profile-image"
        src="profile.jpg"
        alt="profile avatar of website author"
      />
      <div style="display:flex; flex-direction: row;">
        <nav>
          <a href="#about">About</a><a href="#skills">Skills</a
          ><a href="#projects">Projects</a>
        </nav>
        <button style="padding:10px; display:inline-block" id="theme-toggle">Toggle Dark Mode</button>

      </div>
    </div>

    <div id="about" style="height: 500px">About</div>
    <div id="skills" style="height: 500px">Skills</div>
    <div id="projects" style="height: 500px">Projects</div>
    <script src="dark-mode.js" defer></script>
  </body>
</html>
